[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: gpio1
dir_pin: gpio2
enable_pin: !gpio3
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio4
position_endstop: 0
position_max: 200

[tmc4671 stepper_x]
cs_pin: gpio5
spi_software_sclk_pin: gpio6
spi_software_mosi_pin: gpio7
spi_software_miso_pin: gpio8
run_current: 1.0
biquad_flux_frequency: 1000
biquad_torque_frequency: 1000
biquad_velocity_frequency: 1000
biquad_position_frequency: 1000

[stepper_x1]
step_pin: gpio9
dir_pin: gpio10
enable_pin: !gpio11
microsteps: 16
rotation_distance: 40

[tmc4671 stepper_x1]
cs_pin: gpio12
spi_software_sclk_pin: gpio6
spi_software_mosi_pin: gpio7
spi_software_miso_pin: gpio8
run_current: 1.0
biquad_flux_frequency: 1000
biquad_torque_frequency: 1000
biquad_velocity_frequency: 1000
biquad_position_frequency: 1000

[tmc4671_sync awd_x_axis]
leader: stepper_x
follower: stepper_x1
sync_rate: 2000

[stepper_y]
step_pin: gpio13
dir_pin: gpio14
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio15
position_endstop: 0
position_max: 200

[stepper_z]
step_pin: gpio16
dir_pin: gpio17
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio18
position_endstop: 0
position_max: 200

